html[data-tema=floresta]{--bg:#eef6ef;--card:#fff;--tx:#14261a;--mut:#587060;--bd:#d3e5d6;--pri:#1f7a3d;--ok:#12703a;--warn:#8f5a00;--bad:#b42318;--hd:#14442a;--hdt:#fff;--soft:#e1efe4;--okbg:#d9f2e0;--badbg:#fde8e6;--warnbg:#fff4d6;--infobg:#dcebf9;--inp:#fff;--on:#fff}
html[data-tema=ameixa]{--bg:#f6f0f8;--card:#fff;--tx:#261a2e;--mut:#77627f;--bd:#e6d8ec;--pri:#7b2cbf;--ok:#127a3e;--warn:#9a5b00;--bad:#b42318;--hd:#3b1a52;--hdt:#fff;--soft:#efe4f4;--okbg:#e3f6ea;--badbg:#fde8e6;--warnbg:#fff4d6;--infobg:#eadcf8;--inp:#fff;--on:#fff}
*{box-sizing:border-box}body{margin:0;font:15px/1.4 system-ui,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--tx)}
header{background:var(--hd);color:var(--hdt);padding:10px 16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
header h1{font-size:17px;margin:0;flex:1;min-width:150px}
header select{width:auto;padding:6px 8px;font-size:13px;background:rgba(255,255,255,.12);color:var(--hdt);border:1px solid rgba(255,255,255,.25)}
header select option{color:#17202e}
header button{padding:6px 10px;font-size:13px}
main{max-width:1000px;margin:0 auto;padding:14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:12px}
input,select,textarea{width:100%;padding:9px 10px;border:1px solid var(--bd);border-radius:10px;font:inherit;background:var(--inp);color:var(--tx)}
label{display:block;font-size:12px;color:var(--mut);margin:8px 0 3px;font-weight:600}
button{font:inherit;font-weight:700;border:0;border-radius:10px;padding:9px 13px;background:var(--pri);color:var(--on);cursor:pointer}
button.s{background:var(--soft);color:var(--tx)}button.r{background:var(--badbg);color:var(--bad)}button.g{background:var(--okbg);color:var(--ok)}
header button.s{background:rgba(255,255,255,.14);color:var(--hdt)}
button:disabled{opacity:.5}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.row>*{flex:0 0 auto}.grow{flex:1!important;min-width:140px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}@media(max-width:600px){.g2{grid-template-columns:1fr}}
.tag{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:800;white-space:nowrap}
.t-ativa,.t-isenta{background:var(--okbg);color:var(--ok)}.t-teste{background:var(--infobg);color:var(--pri)}
.t-carencia{background:var(--warnbg);color:var(--warn)}.t-vencida,.t-bloqueada{background:var(--badbg);color:var(--bad)}
.cli{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:10px 0;border-top:1px solid var(--bd)}.cli:first-child{border-top:0}
.cli b{display:block}.mut{color:var(--mut);font-size:13px}.det{display:block}
.key{font-family:ui-monospace,Menlo,monospace;font-weight:700;letter-spacing:.5px}
.ov{position:fixed;inset:0;background:#0008;display:none;align-items:flex-start;justify-content:center;overflow:auto;padding:18px;z-index:9}
.ov.on{display:flex}.box{background:var(--card);color:var(--tx);border-radius:16px;padding:16px;max-width:560px;width:100%}
.err{color:var(--bad);font-weight:700;margin:8px 0}.ok{color:var(--ok);font-weight:700;margin:8px 0}
img.qr{width:200px;height:200px;display:block;margin:8px auto;background:#fff}
code{background:var(--soft);padding:2px 5px;border-radius:6px;word-break:break-all}
/* LED de conexão */
.led{display:inline-block;width:11px;height:11px;border-radius:50%;flex:none;vertical-align:middle;margin-right:6px;background:#98a2b3}
.led.v{background:#2ecc71;box-shadow:0 0 7px #2ecc71}.led.a{background:#f5a623;box-shadow:0 0 7px #f5a623}.led.r{background:#e5484d;box-shadow:0 0 7px #e5484d}
.leg{display:flex;gap:14px;flex-wrap:wrap;margin-top:6px;font-size:13px;color:var(--mut)}
/* layouts da lista de lojas */
.lay-cartoes .lista{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:10px}
.lay-cartoes .cli{border:1px solid var(--bd);border-radius:12px;padding:12px;flex-direction:column;align-items:flex-start;background:var(--card)}
.lay-cartoes .cli .grow{width:100%}
.lay-compacto .cli{padding:5px 0;font-size:13px;gap:8px}.lay-compacto .det{display:none}.lay-compacto .cli button{padding:4px 9px;font-size:12px}
.lay-compacto .cli b{display:inline}.lay-compacto .vc{display:inline!important;margin-left:8px}
.vc{display:none;color:var(--mut);font-size:12px}
.lay-compacto .vc{display:inline}
.feed .ev{padding:8px 0;border-top:1px solid var(--bd)}.feed .ev:first-child{border-top:0}.feed .ev.pg{background:var(--okbg);margin:0 -8px;padding:8px;border-radius:8px}
#ptoast{position:fixed;top:14px;right:14px;z-index:99;max-width:min(92vw,380px);background:#067647;color:#fff;padding:12px 16px;border-radius:12px;font-weight:700;box-shadow:0 8px 28px rgba(0,0,0,.35);cursor:pointer}
footer{text-align:center;color:var(--mut);font-size:12px;padding:10px}

html[data-tema=tech]{--bg:#e9f0fb;--card:#fff;--tx:#0a1f44;--mut:#5b6f8f;--bd:#cfdcf2;--pri:#0b6bd6;--ok:#0f8a4c;--warn:#9a5b00;--bad:#c42b1c;--hd:#fff;--hdt:#0a2a6b;--soft:#e4edfb;--okbg:#ddf5e8;--badbg:#fde8e6;--warnbg:#fff4d6;--infobg:#dcebff;--inp:#f7faff;--on:#fff;--hsel:#eef4fd;--hbd:#cfdcf2;--glow:0 0 0 1px rgba(11,107,214,.06),0 10px 28px rgba(10,42,107,.08);--g1:#0a56c9;--g2:#10a0f0}
html[data-tema=techescuro]{--bg:#060c1b;--card:#0d1a35;--tx:#e3ecfb;--mut:#8ea3c6;--bd:#1b3466;--pri:#3d9bff;--ok:#38e08a;--warn:#f5b94a;--bad:#ff7b7b;--hd:#081226;--hdt:#e3ecfb;--soft:#13244a;--okbg:#0f3322;--badbg:#3b1a24;--warnbg:#3a2e12;--infobg:#10305e;--inp:#0a1530;--on:#fff;--hsel:#12234a;--hbd:#27458a;--glow:0 0 0 1px rgba(61,155,255,.12),0 0 24px rgba(16,120,255,.12);--g1:#0a56c9;--g2:#10a0f0}
html[data-tema^=tech] body{background-color:var(--bg);background-image:linear-gradient(rgba(11,107,214,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(11,107,214,.06) 1px,transparent 1px);background-size:32px 32px;min-height:100vh}
html[data-tema=techescuro] body{background-image:linear-gradient(rgba(61,155,255,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(61,155,255,.07) 1px,transparent 1px)}
html[data-tema^=tech] header{position:sticky;top:0;z-index:5;border-bottom:1px solid var(--hbd);box-shadow:0 1px 0 var(--hbd),0 6px 24px rgba(10,42,107,.10)}
html[data-tema^=tech] header::after{content:"";position:absolute;left:0;right:0;bottom:-2px;height:2px;background:linear-gradient(90deg,var(--g1),var(--g2),transparent 85%)}
html[data-tema^=tech] header select{background:var(--hsel);color:var(--hdt);border:1px solid var(--hbd)}
html[data-tema^=tech] header select option{color:#0a1f44;background:#fff}
html[data-tema^=tech] header button.s{background:var(--hsel);color:var(--hdt);border:1px solid var(--hbd)}
html[data-tema^=tech] .card{border-radius:12px;box-shadow:var(--glow);position:relative}
html[data-tema^=tech] .card::before{content:"";position:absolute;left:14px;top:-1px;width:42px;height:2px;background:linear-gradient(90deg,var(--g1),var(--g2));border-radius:2px}
html[data-tema^=tech] button:not(.s):not(.r):not(.g){background:linear-gradient(135deg,var(--g1),var(--g2));box-shadow:0 4px 14px rgba(16,120,255,.28);border:0}
html[data-tema^=tech] button:not(:disabled):hover{filter:brightness(1.08)}
html[data-tema^=tech] button.s{border:1px solid var(--bd)}
html[data-tema^=tech] input:focus,html[data-tema^=tech] select:focus,html[data-tema^=tech] textarea:focus{outline:0;border-color:var(--pri);box-shadow:0 0 0 3px rgba(16,120,255,.22)}
html[data-tema^=tech] .key,html[data-tema^=tech] code{font-family:ui-monospace,"Cascadia Code",Menlo,monospace}
html[data-tema^=tech] .tag{border:1px solid currentColor;background:transparent!important;letter-spacing:.3px}
html[data-tema^=tech] .t-ativa,html[data-tema^=tech] .t-isenta{background:var(--okbg)!important;border-color:transparent}
html[data-tema^=tech] .t-teste{background:var(--infobg)!important;border-color:transparent}
html[data-tema^=tech] .t-carencia{background:var(--warnbg)!important;border-color:transparent}
html[data-tema^=tech] .t-vencida,html[data-tema^=tech] .t-bloqueada{background:var(--badbg)!important;border-color:transparent}
html[data-tema^=tech] .cli{border-top-color:var(--bd)}
html[data-tema^=tech] .lay-cartoes .cli{box-shadow:var(--glow)}
html[data-tema^=tech] .box{box-shadow:var(--glow);border:1px solid var(--bd)}
html[data-tema^=tech] h2{letter-spacing:.2px}
.brand{display:flex;align-items:center;gap:12px;flex:1 0 auto}#srv{white-space:nowrap}.grow:has(.kpis){flex:1 1 100%!important}
.logo{display:block;background:var(--logoc) no-repeat left center/contain;height:46px;width:236px;flex:none}
.logo.big{height:90px;width:100%;background-position:center;margin:2px 0 14px}
.brand .sub{font-size:12px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;opacity:.65;border-left:1px solid var(--hbd,rgba(255,255,255,.3));padding-left:12px;white-space:nowrap}
html[data-tema=techescuro] .logo{background-color:#fff;border-radius:9px;background-origin:content-box;padding:4px 8px;width:240px;height:50px;box-sizing:border-box}
html[data-tema=techescuro] .logo.big{width:min(100%,260px);height:84px;margin:2px auto 14px;padding:8px 14px}
html:not([data-tema^=tech]) .logo{background-color:#fff;border-radius:9px;background-origin:content-box;padding:4px 8px;width:240px;height:50px;box-sizing:border-box}
html:not([data-tema^=tech]) .logo.big{width:min(100%,260px);height:84px;margin:2px auto 14px;padding:8px 14px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(104px,1fr));gap:8px;margin:8px 0 4px}
.kpi{background:var(--soft);border:1px solid var(--bd);border-radius:10px;padding:8px 10px;border-left:3px solid var(--mut)}
.kpi b{display:block;font-size:20px;line-height:1.15;font-variant-numeric:tabular-nums}.kpi span{font-size:11.5px;color:var(--mut);font-weight:600}
.k-ok{border-left-color:var(--ok)}.k-in{border-left-color:var(--pri)}.k-wa{border-left-color:var(--warn)}.k-ba{border-left-color:var(--bad)}.k-mo{border-left-color:var(--g2,var(--pri))}.k-mo b{font-size:17px}
.lgn{display:grid;grid-template-columns:1fr 1fr;max-width:820px;margin:28px auto;border-radius:14px;overflow:hidden;box-shadow:0 14px 44px rgba(10,42,107,.25);border:1px solid rgba(11,107,214,.25)}
.lgn-l{background:#f4f8ff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:28px;min-height:400px}
.lgn-sel{background:#fff;border:1.5px solid #0b6bd6;color:#0a2a6b;font-size:12px;font-weight:700;letter-spacing:1.5px;padding:3px 14px;border-radius:4px}
.lgn-tx{font-size:13px;color:#5b6f8f;text-align:center;max-width:230px}
.lgn-r{background:linear-gradient(160deg,#0a56c9,#0b78e6);padding:30px;display:flex;flex-direction:column;justify-content:center;gap:11px;color:#fff}
.lgn-r h2{margin:6px 0 0;font-size:25px;color:#fff}.lgn-s{color:#cfe3ff;font-size:13px;margin-top:-6px}
.lgn-r .logo.lgn-logo{background-color:#fff;background-origin:content-box;border-radius:10px;padding:8px 14px;width:100%;max-width:330px;height:118px;box-sizing:border-box;align-self:center;background-image:var(--logo);background-position:center}
.lgn-r input{background:#fff!important;color:#0a1f44!important;border:0!important;border-radius:99px;padding:11px 18px}
.lgn-r input::placeholder{color:#7a8aa6}
.lgn-r input:focus{box-shadow:0 0 0 3px rgba(255,255,255,.4)!important}
.lgn-r button{border-radius:99px;padding:10px 26px;box-shadow:none!important;filter:none}
.lgn-b{background:#fff!important;color:#0a56c9!important;border:0!important}
.lgn-o{background:transparent!important;color:#fff!important;border:1.5px solid #fff!important}
.lgn-err{background:#fde8e6;color:#a1190d;border-radius:10px;padding:7px 12px;font-weight:700;font-size:13px}
@media(max-width:700px){.lgn{grid-template-columns:1fr}.lgn-l{display:none}}
</style></head><body>
<header><div class="brand"><span class="logo" role="img" aria-label="AdaptaSys"></span><span class="sub">Painel de licenças</span></div><span id="srv" title=""></span>
<select id="selTema" onchange="setPref('tema',this.value)" aria-label="Tema"><option value="tech">Tema: Tech claro</option><option value="techescuro">Tema: Tech escuro</option><option value="claro">Tema: Claro</option><option value="escuro">Tema: Escuro</option><option value="oceano">Tema: Oceano</option><option value="floresta">Tema: Floresta</option><option value="ameixa">Tema: Ameixa</option></select>
<select id="selIdle" onchange="setPref('idle',this.value)" aria-label="Tempo de sessão"><option value="0">Sessão: sem limite</option><option value="5">Sessão: 5 min</option><option value="10">Sessão: 10 min</option><option value="15">Sessão: 15 min</option><option value="30">Sessão: 30 min</option><option value="60">Sessão: 60 min</option><option value="120">Sessão: 2 h</option></select>
<select id="selLay" onchange="setPref('lay',this.value)" aria-label="Layout"><option value="lista">Layout: Lista</option><option value="cartoes">Layout: Cartões</option><option value="compacto">Layout: Compacto</option></select>
<span id="who" class="mut" style="color:inherit;opacity:.8"></span><button class="s" id="bSair" style="display:none" onclick="sair()">Sair</button></header>
<main id="app"></main><footer>Painel de licenças v1.3.1 · AdaptaSys</footer>
<div class="ov" id="ov"><div class="box" id="box"></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const brl=c=>(c/100).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const dt=d=>d?String(d).slice(0,10).split('-').reverse().join('/'):'—';
const LS={get(k){try{return localStorage.getItem(k)||''}catch(e){return ''}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
let sb=null,sess=null,DATA={clientes:[],planos:[]},FILT='',BUSCA='';
const ROT={ativa:'Em dia',teste:'Em teste',carencia:'Em carência',vencida:'Vencida',bloqueada:'Bloqueada',isenta:'Isenta'};

function cfg(){return {url:LS.get('lp_url'),key:LS.get('lp_key')}}
function fnUrl(){return cfg().url.replace(/\/+$/,'')+'/functions/v1/'+(LS.get('lp_fn')||'licenca')}
async function api(action,extra){
  const {data:{session}}=await sb.auth.getSession();
  const r=await fetch(fnUrl(),{method:'POST',headers:{'Content-Type':'application/json','apikey':cfg().key,'Authorization':'Bearer '+(session?.access_token||cfg().key)},body:JSON.stringify({action,...(extra||{})})});
  let j;try{j=await r.json()}catch(e){j={ok:false,erro:'Resposta inválida do servidor ('+r.status+').'}}
  if(!j.ok)throw new Error(j.erro||'Erro');return j;
}
function viewConfig(msg){
  $('#app').innerHTML=`<div class="card"><h2 style="margin-top:0">Conectar ao projeto central</h2>
  <p class="mut">Use o projeto Supabase onde você rodou <code>supabase-licencas.sql</code>. A chave é a <b>anon (pública)</b> — nunca a service_role.</p>
  <label>URL do projeto</label><input id="cu" placeholder="https://xxxx.supabase.co" value="${esc(cfg().url)}">
  <label>Chave anon</label><input id="ck" value="${esc(cfg().key)}">
  <label>Endereço da função (o que aparece depois de /functions/ na URL dela)</label><input id="cf" placeholder="licenca" value="${esc(LS.get('lp_fn')||'licenca')}">
  ${msg?`<div class="err">${esc(msg)}</div>`:''}
  <div class="row" style="margin-top:10px"><button onclick="salvaCfg()">Conectar</button></div></div>`;
}
function salvaCfg(){
  const u=$('#cu').value.trim().replace(/\/+$/,''),k=$('#ck').value.trim();
  if(!/^https:\/\/[a-z0-9-]+\.supabase\.co$/i.test(u))return viewConfig('URL inválida. Exemplo: https://abcd.supabase.co');
  if(k.length<20)return viewConfig('Cole a chave anon.');
  LS.set('lp_url',u);LS.set('lp_key',k);LS.set('lp_fn',($('#cf').value.trim().replace(/[^a-z0-9_-]/gi,'')||'licenca'));boot();
}
function viewLogin(msg){
  const m=idleMin(),tm=m?(m>=120?m/60+' h':m+' min'):'';
  $('#app').innerHTML=`<div class="lgn"><div class="lgn-l"><svg viewBox="0 0 220 190" width="230" height="200" role="img" aria-label="Escudo com chave"><circle cx="110" cy="95" r="84" fill="#e1ecff"/><path d="M110 22 L170 44 V96 C170 132 144 156 110 168 C76 156 50 132 50 96 V44 Z" fill="#fff" stroke="#0b6bd6" stroke-width="4"/><path d="M110 34 L158 51 V96 C158 125 137 145 110 156 C83 145 62 125 62 96 V51 Z" fill="#0b6bd6"/><circle cx="110" cy="84" r="16" fill="none" stroke="#fff" stroke-width="6"/><rect x="107" y="99" width="6" height="34" rx="2" fill="#fff"/><rect x="113" y="118" width="12" height="5" rx="2" fill="#fff"/><rect x="113" y="127" width="9" height="5" rx="2" fill="#fff"/><rect x="22" y="40" width="10" height="10" rx="2" fill="#0b6bd6"/><rect x="36" y="28" width="7" height="7" rx="2" fill="#0b6bd6"/><rect x="190" y="150" width="12" height="12" rx="2" fill="#10a0f0"/><rect x="176" y="166" width="7" height="7" rx="2" fill="#0b6bd6"/></svg><div class="lgn-sel">ACESSO SEGURO</div><div class="lgn-tx">${tm?'Sessão protegida: sai sozinha após '+tm+' sem uso.':'Área restrita ao administrador.'}</div></div>
  <div class="lgn-r"><span class="logo lgn-logo" role="img" aria-label="AdaptaSys"></span><h2>Bem-vindo</h2><div class="lgn-s">Entre para gerenciar as licenças.</div>
  <input id="le" type="email" placeholder="seu e-mail" aria-label="E-mail" autocomplete="username" value="${esc(LS.get('lp_mail'))}">
  <input id="lp" type="password" placeholder="sua senha" aria-label="Senha" autocomplete="current-password" onkeydown="if(event.key==='Enter')entrar()">
  ${msg?`<div class="lgn-err">${esc(msg)}</div>`:''}
  <div class="row" style="margin-top:8px"><button class="lgn-b" onclick="entrar()">Entrar</button><button class="lgn-o" onclick="viewConfig()">Trocar projeto</button></div></div></div>`;
}
async function entrar(){
  const email=$('#le').value.trim(),password=$('#lp').value;
  const {error}=await sb.auth.signInWithPassword({email,password});
  if(error)return viewLogin('E-mail ou senha incorretos.');
  LS.set('lp_mail',email);boot();
}
async function sair(msg){try{await sb.auth.signOut()}catch(e){}sess=null;try{localStorage.removeItem('lp_act')}catch(e){}NOTA=msg||'';boot()}
/* ---------- sessão com limite de inatividade (configurável no cabeçalho) ---------- */
let NOTA='',ULT=Date.now(),AVISO=false;
const idleMin=()=>{const v=LS.get('lp_idle');return v===''||v==null?15:Math.max(0,+v||0)};
function tocou(force){const n=Date.now();if(!force&&n-ULT<1000)return;ULT=n;try{localStorage.setItem('lp_act',String(n))}catch(e){}if(AVISO)avisoIdle(false)}
function avisoIdle(on,seg){
  let d=document.getElementById('idleav');AVISO=!!on;
  if(!on){if(d)d.remove();return}
  if(!d){d=document.createElement('div');d.id='idleav';d.setAttribute('role','alert');d.style.cssText='position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:99;background:#fff4d6;color:#5c3d00;border:1px solid #e6c36a;border-radius:12px;padding:10px 14px;font-weight:700;box-shadow:0 8px 28px rgba(0,0,0,.3);display:flex;gap:12px;align-items:center';d.innerHTML='<span></span><button type="button" onclick="tocou(true)">Continuar logado</button>';document.body.appendChild(d)}
  d.firstChild.textContent='Sessão expira em '+seg+' s por inatividade.';
}
function vigiaIdle(){
  if(!sess)return;const m=idleMin();if(!m){avisoIdle(false);return}
  const rest=m*60000-(Date.now()-ULT);
  if(rest<=0){avisoIdle(false);sair('Sessão encerrada por inatividade ('+(m>=120?m/60+' h':m+' min')+'). Entre novamente.')}
  else if(rest<=30000)avisoIdle(true,Math.ceil(rest/1000));
}
['mousedown','keydown','touchstart','wheel','scroll'].forEach(e=>addEventListener(e,()=>tocou(),{passive:true,capture:true}));
addEventListener('mousemove',()=>tocou(),{passive:true});
setInterval(vigiaIdle,1000);
async function boot(){
  const c=cfg();$('#who').textContent='';$('#bSair').style.display='none';
  paraPoll();if(!c.url||!c.key)return viewConfig();
  sb=supabase.createClient(c.url,c.key,{auth:{persistSession:true,storageKey:'lp_auth'}});
  let {data:{session}}=await sb.auth.getSession();sess=session;
  if(session){const m=idleMin(),la=+localStorage.getItem('lp_act')||0;if(m&&la&&Date.now()-la>m*60000){try{await sb.auth.signOut()}catch(e){}sess=null;session=null;NOTA='Sessão encerrada por inatividade. Entre novamente.'}}
  if(!session){const n=NOTA;NOTA='';return viewLogin(n)}
  $('#who').textContent=session.user.email;$('#bSair').style.display='';tocou(true);
  await carregar();iniciaPoll();
}
async function carregar(){
  try{
    $('#app').innerHTML='<div class="card mut">Carregando…</div>';
    const j=await api('listar');DATA=j;ledSrv(true);LASTSRV=Date.now();lista();
  }catch(e){ledSrv(false,e.message);$('#app').innerHTML=`<div class="card"><div class="err">${esc(e.message)}</div><p class="mut">Confira se a função <code>licenca</code> foi criada, se o segredo <code>LIC_ADMIN_EMAILS</code> contém seu e-mail e se o SQL foi executado.</p><div class="row"><button onclick="carregar()">Tentar de novo</button><button class="s" onclick="infoServidor()">Chave pública / URL</button></div></div>`}
}
function ledLoja(c){ /* verde: conferiu nas últimas 12 h · amarelo: até 3 dias (usando a última conferência) · vermelho: mais de 3 dias · cinza: nunca conectou */
  if(!c.ultimo_check)return{c:'',t:'Nunca conectou à central.'};
  const hrs=(Date.now()-new Date(c.ultimo_check).getTime())/36e5,q=new Date(c.ultimo_check).toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}),ap=(c.ultimo_app?' · '+c.ultimo_app+' '+(c.ultima_versao||''):'');
  const rel=hrs<1?'agora há pouco':hrs<48?'há '+Math.round(hrs)+' h':'há '+Math.round(hrs/24)+' dias';
  if(hrs<=12)return{c:'v',t:'Conectada · última conferência '+rel+' ('+q+')'+ap};
  if(hrs<=72)return{c:'a',t:'Sem sinal '+rel+' ('+q+')'+ap};
  return{c:'r',t:'Sem sinal '+rel+' ('+q+')'+ap};
}
function lista(){
  const L=DATA.clientes.filter(c=>(!FILT||c.estado.st===FILT)&&(!BUSCA||(c.nome+' '+(c.cnpj||'')+' '+c.chave).toLowerCase().includes(BUSCA.toLowerCase())));
  const cont=s=>DATA.clientes.filter(c=>c.estado.st===s).length;
  const receita=DATA.clientes.filter(c=>['ativa','carencia'].includes(c.estado.st)).reduce((s,c)=>s+(c.preco_centavos||0),0);
  const lc=k=>DATA.clientes.filter(c=>ledLoja(c).c===k).length;
  $('#app').className='lay-'+(LS.get('lp_lay')||'lista');
  $('#app').innerHTML=`<div class="card"><div class="row">
   <div class="grow"><b style="font-size:18px">${DATA.clientes.length} loja(s)</b><div class="kpis"><div class="kpi k-ok"><b>${cont('ativa')}</b><span>Em dia</span></div><div class="kpi k-in"><b>${cont('teste')}</b><span>Teste</span></div><div class="kpi k-wa"><b>${cont('carencia')}</b><span>Carência</span></div><div class="kpi k-ba"><b>${cont('vencida')}</b><span>Vencidas</span></div><div class="kpi k-ba"><b>${cont('bloqueada')}</b><span>Bloqueadas</span></div><div class="kpi k-mo"><b>${brl(receita)}</b><span>Por mês (quem paga)</span></div></div>
   <div class="leg"><span><i class="led v"></i>${lc('v')} conectada(s)</span><span><i class="led a"></i>${lc('a')} sem sinal até 3 dias</span><span><i class="led r"></i>${lc('r')} sem sinal há mais</span><span><i class="led"></i>${lc('')} nunca conectou</span></div></div>
   <button onclick="editar()">+ Nova loja</button><button class="s" onclick="atividade()">Atividade</button><button class="s" onclick="planos()">Planos</button><button class="s" onclick="infoServidor()">Servidor</button><button class="s" id="bSom" onclick="togSom()">${LS.get('lp_som')==='0'?'Som: desligado':'Som: ligado'}</button></div>
   <div class="row" style="margin-top:10px"><input class="grow" placeholder="Buscar nome, CNPJ ou chave" value="${esc(BUSCA)}" oninput="BUSCA=this.value;lista();this.focus()">
   <select style="width:auto" onchange="FILT=this.value;lista()"><option value="">Todas</option>${Object.keys(ROT).map(k=>`<option value="${k}" ${FILT===k?'selected':''}>${ROT[k]}</option>`).join('')}</select></div></div>
  <div class="card"><div class="lista">${L.map(c=>{const e=c.estado,fa=c.fatura_aberta,l=ledLoja(c),vence=dt(e.ate)+(e.st==='ativa'||e.st==='teste'?' ('+e.dias+' d)':'');return `<div class="cli">
   <i class="led ${l.c}" title="${esc(l.t)}"></i>
   <div class="grow"><b>${esc(c.nome)}<span class="vc">válida até ${vence}</span></b><span class="mut det">${esc(c.plano)} · ${brl(c.preco_centavos||0)} · válida até ${vence}</span><span class="mut det">${esc(l.t)}</span>${fa?`<span class="mut det">Cobrança aberta ${esc(fa.ref)}: ${brl(fa.valor_centavos)}</span>`:''}</div>
   <span class="tag t-${e.st}">${ROT[e.st]||e.st}</span><button class="s" onclick="abrir('${c.id}')">Abrir</button></div>`}).join('')||'<p class="mut">Nenhuma loja.</p>'}</div></div>`;
}
function modal(h){$('#box').innerHTML=h;$('#ov').classList.add('on')}
function fechar(){$('#ov').classList.remove('on')}
$('#ov').addEventListener('mousedown',e=>{if(e.target.id==='ov')fechar()});
async function tenta(fn,ok){try{await fn();if(ok)toast(ok)}catch(e){alert(e.message)}}
function toast(m){const d=document.createElement('div');d.textContent=m;d.style.cssText='position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#101828;color:#fff;padding:9px 16px;border-radius:99px;z-index:99;font-weight:700';document.body.appendChild(d);setTimeout(()=>d.remove(),2200)}
function copiar(t){navigator.clipboard?.writeText(t).then(()=>toast('Copiado'),()=>prompt('Copie:',t))||prompt('Copie:',t)}

function editar(id){
  const c=id?DATA.clientes.find(x=>x.id===id):{};
  modal(`<h3 style="margin-top:0">${id?'Editar loja':'Nova loja'}</h3>
  <label>Nome da loja *</label><input id="fn" value="${esc(c.nome)}">
  <div class="g2"><div><label>CNPJ</label><input id="fc" value="${esc(c.cnpj)}"></div><div><label>Contato</label><input id="fo" value="${esc(c.contato)}"></div>
  <div><label>WhatsApp (com DDD)</label><input id="ff" value="${esc(c.fone)}"></div><div><label>E-mail</label><input id="fe" value="${esc(c.email)}"></div></div>
  <label>Plano</label><select id="fp">${DATA.planos.filter(p=>p.ativo||p.id===c.plan_id).map(p=>`<option value="${p.id}" ${p.id===c.plan_id?'selected':''}>${esc(p.nome)} — ${brl(p.preco_centavos)}</option>`).join('')}</select>
  <label>Observações</label><textarea id="fb" rows="2">${esc(c.obs)}</textarea>
  <div class="row" style="margin-top:12px"><button onclick="salvarCli('${id||''}')">Salvar</button><button class="s" onclick="fechar()">Cancelar</button></div>`);
}
async function salvarCli(id){
  await tenta(async()=>{const j=await api('cliente_salvar',{id:id||undefined,nome:$('#fn').value,cnpj:$('#fc').value,contato:$('#fo').value,fone:$('#ff').value,email:$('#fe').value,plan_id:$('#fp').value||null,obs:$('#fb').value});
    await carregar();if(!id&&j.cliente)abrir(j.cliente.id);else fechar()});
}
function abrir(id){
  const c=DATA.clientes.find(x=>x.id===id);if(!c)return fechar();const e=c.estado;
  modal(`<div class="row"><h3 style="margin:0" class="grow">${esc(c.nome)}</h3><span class="tag t-${e.st}">${ROT[e.st]}</span></div>
  <p class="mut">${esc(c.plano)} · ${brl(c.preco_centavos||0)}/mês · válida até <b>${dt(e.ate)}</b> · carência até ${dt(e.car)}${c.cnpj?` · CNPJ ${esc(c.cnpj)}`:''}</p>
  <label>Chave de licença (coloque em Empresa › Licença da loja)</label>
  <div class="row"><span class="key grow">${esc(c.chave)}</span><button class="s" onclick="copiar('${esc(c.chave)}')">Copiar</button><button class="s" onclick="novaChave('${id}')">Gerar outra</button></div>
  <div class="row" style="margin-top:12px">
   <button class="s" onclick="editar('${id}')">Editar</button>
   <button onclick="cobrar('${id}')">Gerar cobrança Pix</button>
   <button class="g" onclick="cortesia('${id}')">Dar cortesia (dias)</button>
   ${c.situacao==='bloqueada'?`<button class="g" onclick="acao('${id}','liberar')">Liberar</button>`:`<button class="r" onclick="acao('${id}','bloquear')">Bloquear</button>`}
   ${c.situacao==='isenta'?`<button class="s" onclick="acao('${id}','normal')">Voltar a cobrar</button>`:`<button class="s" onclick="acao('${id}','isentar')">Isentar</button>`}
  </div><div id="hist" class="mut" style="margin-top:14px">Carregando histórico…</div>
  <div class="row" style="margin-top:12px"><button class="s" onclick="fechar()">Fechar</button><button class="r" onclick="excluir('${id}')">Excluir loja</button></div>`);
  api('faturas',{id}).then(j=>{
    const h=$('#hist');if(!h)return;
    h.innerHTML=`<b>Cobranças</b>`+(j.faturas.map(f=>`<div class="cli"><div class="grow">${esc(f.ref)} · ${brl(f.valor_centavos)} · ${esc(f.status)}${f.paga_em?' em '+dt(f.paga_em):''}</div>
      ${f.status==='pendente'?`<button class="s" onclick="verFatura('${id}','${f.id}')">Ver Pix</button><button class="g" onclick="baixar('${id}','${f.id}')">Baixa manual</button><button class="r" onclick="cancelaF('${id}','${f.id}')">Cancelar</button>`:''}</div>`).join('')||'<div class="mut">Nenhuma ainda.</div>')
      +`<div style="margin-top:10px"><b>Eventos</b></div>`+(j.eventos.slice(0,10).map(v=>`<div class="mut">${dt(v.em)} · ${esc(v.tipo)}</div>`).join('')||'<div class="mut">—</div>');
    window._fat=j.faturas;
  }).catch(e=>{const h=$('#hist');if(h)h.innerHTML='<span class="err">'+esc(e.message)+'</span>'});
}
async function novaChave(id){if(!confirm('Gerar outra chave? A loja precisará digitar a nova chave.'))return;
  await tenta(async()=>{const j=await api('chave_nova',{id});await carregar();abrir(id)},'Nova chave gerada')}
async function acao(id,a){await tenta(async()=>{await api('cliente_acao',{id,acao:a});await carregar();abrir(id)},'Feito')}
async function cortesia(id){const d=prompt('Quantos dias de cortesia (1 a 365)?','30');if(!d)return;
  await tenta(async()=>{await api('cliente_estender',{id,dias:Number(d)});await carregar();abrir(id)},'Prazo estendido')}
async function excluir(id){if(!confirm('Excluir esta loja e o histórico? A loja perderá a licença.'))return;
  await tenta(async()=>{await api('cliente_excluir',{id});fechar();await carregar()},'Excluída')}
async function cobrar(id){await tenta(async()=>{const j=await api('fatura_criar',{id});await carregar();mostraFatura(id,j.fatura)})}
function verFatura(id,fid){const f=(window._fat||[]).find(x=>x.id===fid);if(f)mostraFatura(id,f)}
function mostraFatura(id,f){
  const c=DATA.clientes.find(x=>x.id===id)||{};
  const msg=`Olá! Segue a mensalidade do sistema (${f.ref}) no valor de ${brl(f.valor_centavos)}.\nPix copia e cola:\n${f.qr_code}\nApós o pagamento a licença renova sozinha.`;
  const wa=c.fone?`https://wa.me/55${String(c.fone).replace(/^55/,'')}?text=${encodeURIComponent(msg)}`:'';
  modal(`<h3 style="margin-top:0">Cobrança ${esc(f.ref)} — ${brl(f.valor_centavos)}</h3>
  ${f.qr_base64?`<img class="qr" src="data:image/png;base64,${esc(f.qr_base64)}" alt="QR Pix">`:''}
  <label>Pix copia e cola</label><code>${esc(f.qr_code)}</code>
  <div class="row" style="margin-top:10px"><button onclick="copiar(${esc(JSON.stringify(f.qr_code||''))})">Copiar Pix</button>
  ${wa?`<a href="${wa}" target="_blank" rel="noopener"><button class="g">Enviar por WhatsApp</button></a>`:''}
  <button class="s" onclick="sync('${id}','${f.id}')">Conferir pagamento</button><button class="s" onclick="abrir('${id}')">Voltar</button></div>`);
}
async function sync(id,fid){await tenta(async()=>{const j=await api('fatura_sync',{id:fid});await carregar();toast(j.status==='paga'?'Pago! Licença renovada.':'Ainda pendente');abrir(id)})}
async function baixar(id,fid){if(!confirm('Marcar como recebida por fora (dinheiro/transferência) e renovar a licença por 1 mês?'))return;
  await tenta(async()=>{const j=await api('fatura_baixar',{id:fid});await carregar();abrir(id)},'Baixa registrada')}
async function cancelaF(id,fid){await tenta(async()=>{await api('fatura_cancelar',{id:fid});abrir(id)},'Cancelada')}
function planos(){
  modal(`<h3 style="margin-top:0">Planos</h3>`+DATA.planos.map(p=>`<div class="card"><div class="g2">
   <div><label>Nome</label><input id="pn${p.id}" value="${esc(p.nome)}"></div><div><label>Preço mensal (R$)</label><input id="pv${p.id}" value="${(p.preco_centavos/100).toFixed(2)}"></div>
   <div><label>Dias de teste</label><input id="pt${p.id}" type="number" value="${p.dias_teste}"></div><div><label>Dias de carência</label><input id="pc${p.id}" type="number" value="${p.dias_carencia}"></div>
   <div><label>Dias sem internet permitidos</label><input id="po${p.id}" type="number" value="${p.off_dias}"></div></div>
   <div class="row" style="margin-top:8px"><button onclick="salvaPlano('${p.id}')">Salvar plano</button></div></div>`).join('')
   +`<div class="row"><button class="s" onclick="novoPlano()">+ Novo plano</button><button class="s" onclick="fechar()">Fechar</button></div><p class="mut">Mudar o preço vale para as próximas cobranças; as já geradas mantêm o valor.</p>`);
}
async function salvaPlano(id){await tenta(async()=>{await api('plano_salvar',{id,nome:$('#pn'+id).value,preco_centavos:Math.round(parseFloat(String($('#pv'+id).value).replace(',','.'))*100),dias_teste:$('#pt'+id).value,dias_carencia:$('#pc'+id).value,off_dias:$('#po'+id).value});await carregar();planos()},'Plano salvo')}
async function novoPlano(){const n=prompt('Nome do novo plano:');if(!n)return;await tenta(async()=>{await api('plano_salvar',{nome:n,preco_centavos:9900,dias_teste:14,dias_carencia:5,off_dias:10});await carregar();planos()})}
async function infoServidor(){
  modal('<p class="mut">Carregando…</p>');
  try{const j=await api('admin_init');
    modal(`<h3 style="margin-top:0">Servidor de licenças</h3>
    <p>${j.mp?'<span class="ok">Mercado Pago configurado.</span>':'<span class="err">Segredo MP_ACCESS_TOKEN não definido — cobrança por Pix indisponível.</span>'}</p>
    <label>URL da função (vai no app como LIC_URL)</label><code>${esc(j.url)}</code>
    <label>Chave pública de assinatura (não é segredo)</label><code>${esc(JSON.stringify(j.pub))}</code>
    <label>Webhook do Mercado Pago</label><code>${esc(j.url+'?hook=1')}</code>
    <div class="row" style="margin-top:12px"><button class="s" onclick="copiar(${esc(JSON.stringify(JSON.stringify(j.pub)))})">Copiar chave pública</button><button class="s" onclick="fechar()">Fechar</button></div>`);
  }catch(e){modal(`<div class="err">${esc(e.message)}</div><button class="s" onclick="fechar()">Fechar</button>`)}
}
/* ---------- tema, layout, som ---------- */
function aplicaPrefs(){
  const t=LS.get('lp_tema')||'tech',l=LS.get('lp_lay')||'lista';
  document.documentElement.dataset.tema=t;
  const a=$('#selTema'),b=$('#selLay'),c=$('#selIdle');if(a)a.value=t;if(b)b.value=l;if(c)c.value=String(idleMin());
}
function setPref(k,v){LS.set('lp_'+k,v);aplicaPrefs();if(k==='idle')tocou(true);if(DATA&&DATA.clientes&&sess&&$('#app').querySelector('.lista'))lista()}
function togSom(){LS.set('lp_som',LS.get('lp_som')==='0'?'1':'0');const b=$('#bSom');if(b)b.textContent=LS.get('lp_som')==='0'?'Som: desligado':'Som: ligado';if(LS.get('lp_som')!=='0')beep()}
function beep(){
  if(LS.get('lp_som')==='0')return;
  try{const A=window.AudioContext||window.webkitAudioContext,c=new A(),o=c.createOscillator(),g=c.createGain();o.type='sine';o.frequency.value=880;g.gain.value=.15;o.connect(g);g.connect(c.destination);o.start();
    o.frequency.setValueAtTime(1175,c.currentTime+.14);o.stop(c.currentTime+.32);setTimeout(()=>c.close(),600)}catch(e){}
}
function pToast(m){
  const o=document.getElementById('ptoast');if(o)o.remove();
  const d=document.createElement('div');d.id='ptoast';d.textContent=m;d.onclick=()=>{d.remove();atividade()};document.body.appendChild(d);setTimeout(()=>{try{d.remove()}catch(e){}},12000);
}
/* ---------- atividade recente e aviso de pagamento ---------- */
const EVT={paga:'💰',fatura_criada:'🧾',criado:'🆕',estendido:'🎁',chave_nova:'🔑',situacao_bloquear:'⛔',situacao_liberar:'✅',situacao_isentar:'🆓',situacao_normal:'↩️'};
function evTxt(e){
  const l=e.loja||'(loja removida)',v=e.valor_centavos!=null?' '+brl(e.valor_centavos):'';
  if(e.tipo==='paga')return `<b>${esc(l)}</b> pagou${v}${e.ref?' ('+esc(e.ref)+')':''}${e.forma?' · '+esc(e.forma):''}${e.vence_em?' · válida até '+dt(e.vence_em):''}`;
  if(e.tipo==='fatura_criada')return `Cobrança gerada para <b>${esc(l)}</b>${v}${e.ref?' ('+esc(e.ref)+')':''}`;
  if(e.tipo==='criado')return `Loja <b>${esc(l)}</b> criada`;
  if(e.tipo==='estendido')return `Cortesia dada a <b>${esc(l)}</b>`;
  if(e.tipo==='chave_nova')return `Nova chave gerada para <b>${esc(l)}</b>`;
  if(e.tipo.startsWith('situacao_'))return `<b>${esc(l)}</b>: ${esc(e.tipo.slice(9))}`;
  return `<b>${esc(l)}</b>: ${esc(e.tipo)}`;
}
async function atividade(){
  modal('<p class="mut">Carregando…</p>');
  try{const j=await api('atividade');
    modal(`<h3 style="margin-top:0">Atividade recente</h3><div class="feed">${j.eventos.map(e=>`<div class="ev ${e.tipo==='paga'?'pg':''}"><span class="mut">${new Date(e.em).toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})}</span> ${EVT[e.tipo]||'•'} ${evTxt(e)}</div>`).join('')||'<p class="mut">Nada ainda.</p>'}</div>
    <div class="row" style="margin-top:12px"><button class="s" onclick="fechar()">Fechar</button></div>`);
    if(j.eventos.length)LS.set('lp_lastev',String(Math.max(...j.eventos.map(e=>e.id))));
    document.title='Painel de licenças';
  }catch(e){modal(`<div class="err">${esc(e.message)}</div><button class="s" onclick="fechar()">Fechar</button>`)}
}
let POLL=null,LASTSRV=0;
function ledSrv(ok,t){const e=$('#srv');if(!e)return;e.innerHTML=ok===null?'':`<i class="led ${ok?'v':'r'}"></i><span style="font-size:12px;opacity:.85">${ok?'Servidor online':'Servidor sem resposta'}</span>`;e.title=t||''}
async function sondar(){
  if(!sess||document.hidden)return;
  try{
    const j=await api('atividade');ledSrv(true,'Última resposta '+new Date().toLocaleTimeString('pt-BR'));
    const maxId=j.eventos.length?Math.max(...j.eventos.map(e=>e.id)):0,last=LS.get('lp_lastev');
    if(last===''){LS.set('lp_lastev',String(maxId));return}  /* primeira vez: só marca o ponto de partida */
    const novos=j.eventos.filter(e=>e.id>Number(last)).sort((a,b)=>a.id-b.id),pagos=novos.filter(e=>e.tipo==='paga');
    if(novos.length)LS.set('lp_lastev',String(maxId));
    if(pagos.length){
      const e=pagos[pagos.length-1];beep();
      pToast('💰 '+(e.loja||'Uma loja')+' pagou'+(e.valor_centavos!=null?' '+brl(e.valor_centavos):'')+(pagos.length>1?' (+'+(pagos.length-1)+' pagamento(s))':''));
      document.title='(💰'+pagos.length+') Painel de licenças';
    }
    if(novos.length&&$('#app').querySelector('.lista')){try{DATA=await api('listar');lista()}catch(e){}}
    else if(!novos.length&&$('#app').querySelector('.lista')&&Date.now()-LASTSRV>5*60e3){try{DATA=await api('listar');lista();LASTSRV=Date.now()}catch(e){}}
  }catch(e){ledSrv(false,e.message)}
}
function iniciaPoll(){if(POLL)clearInterval(POLL);POLL=setInterval(sondar,60000);sondar()}
function paraPoll(){if(POLL){clearInterval(POLL);POLL=null}}
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&sess)sondar()});
aplicaPrefs();

boot();
</script></body></html>
